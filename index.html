<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>TradeLive</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1 id="titulo">TradeLive</h1>
    <hr style="margin-bottom: 30px;">
    <p>Estado: <b id="estado">Conectando...</b> ·
        Última actualización: <span id="hora">-</span></p>

    <table>
        <thead>
            <tr>
                <th>Moneda</th>
                <th>Precio (USD)</th>
                <th>Cambio</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>

    <canvas id="grafico" width="600" height="160"></canvas>

    <div class="panel">
        <b>Crear alerta:</b>
        <select id="moneda">
            <option>BTC</option>
            <option>ETH</option>
            <option>SOL</option>
        </select>
        <select id="condicion">
            <option value="mayor">≥ mayor o igual</option>
            <option value="menor">≤ menor o igual</option>
        </select>
        <input id="precio" type="number" placeholder="Precio" style="width:110px">
        <button id="btnAlerta">Crear</button>
    </div>
    <div id="avisos"></div>
</body>
